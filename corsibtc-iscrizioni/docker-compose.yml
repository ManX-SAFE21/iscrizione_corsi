version: "3.7"

services:
  # Ingresso PUBBLICO (modulo iscrizioni). Senza login Umbrel, perché deve
  # essere visibile a chiunque abbia il link. Il pannello admin NON passa da qui.
  app_proxy:
    environment:
      APP_HOST: corsibtc-iscrizioni_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: node:22-alpine
    restart: on-failure
    user: "1000:1000"
    working_dir: /app
    command: ["node", "--no-warnings", "/app/server.js"]
    environment:
      PUBLIC_PORT: 3000
      ADMIN_PORT: 3001
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
    ports:
      # Pannello ADMIN: http://umbrel.local:9150  (solo rete di casa).
      # Non puntare mai il tunnel Cloudflare su questa porta.
      - "9150:3001"
