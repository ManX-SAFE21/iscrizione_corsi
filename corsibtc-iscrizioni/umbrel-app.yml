version: "1.7.2"
tagline: Iscrizioni ai corsi con soglia minima e date indicative
description: >-
  Gestisci le iscrizioni ai tuoi corsi (base, medio, avanzato) in più città.
  Ogni corso ha un numero minimo e massimo di iscritti e delle fasce orarie
  indicative. Quando si raggiunge il minimo ricevi un avviso su Telegram e
  scegli la data in base alle disponibilità. La pagina pubblica mostra solo
  l'elenco dei corsi e il modulo di iscrizione (raggiungibile con un tunnel
  Cloudflare); l'icona dell'app apre il pannello di gestione, protetto dal
  login di Umbrel.
