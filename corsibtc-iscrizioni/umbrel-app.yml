releaseNotes: "La pagina principale della gestione usa le stesse schede della pagina pubblica, affiancate e divise per livello, con il selettore Tutti / Base / Medio / Avanzato accanto al titolo. Ogni scheda mostra gli avvisi per il gestore (minimo raggiunto, lista d'attesa) e il pulsante Gestisci. Accanto al titolo c'è anche il pulsante Nuovo corso. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
