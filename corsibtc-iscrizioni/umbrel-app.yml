tagline: Iscrizioni a eventi e corsi Bitcoin, con soglia minima
description: >-
  Gestisci le iscrizioni ai tuoi eventi e corsi Bitcoin (corsi base, medio,
  avanzato ed eventi come le presentazioni) in più città. Ognuno ha un numero
  minimo e massimo di iscritti e una data già decisa oppure delle fasce orarie
  da scegliere con gli iscritti. Quando si raggiunge il minimo ricevi un avviso
  su Telegram. La pagina pubblica mostra solo
  l'elenco dei corsi e il modulo di iscrizione (raggiungibile con un tunnel
  Cloudflare); l'icona dell'app apre il pannello di gestione, protetto dal
  login di Umbrel.
