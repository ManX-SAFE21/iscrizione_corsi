releaseNotes: "Home a bacheca: i 4 tipi (Eventi, Base, Medio, Avanzato) stanno sempre affiancati, e in ogni colonna le schede scendono sovrapposte con la più recente in alto. Una colonna senza corsi lo dice. Le pagine larghe stanno in una colonna chiara di 1100 pixel di contenuto. La gestione cambia allo stesso modo. Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
