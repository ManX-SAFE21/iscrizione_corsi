releaseNotes: "Nuova grafica Bento: riquadri chiari con titolo, numeri e prossimo appuntamento in alto; colonne tinte del colore del tipo; schede con la testata colorata e la data in grande, con immagine se c'è. Pagina del corso e gestione nello stesso stile (la gestione ha la barra scura e il pulsante Sito pubblico). Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
