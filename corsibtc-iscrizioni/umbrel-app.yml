releaseNotes: "Email già pronte per gli iscritti, senza password né configurazioni: si aprono nel tuo programma di posta e premi Invia. Dopo la conferma del corso, il riquadro Avvisa gli iscritti prepara l'email con data, orari, luogo e mappa, contributo e cosa portare, con tutti gli iscritti in copia nascosta. Su ogni iscritto c'è anche una busta per scrivere solo a lui: conferma completa se il corso è confermato, altrimenti iscrizione ricevuta. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
