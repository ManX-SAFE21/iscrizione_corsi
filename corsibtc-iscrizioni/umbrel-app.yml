releaseNotes: "Arrivano gli eventi. Il pulsante Nuovo corso diventa Nuovo evento e nel modulo si sceglie il tipo: Corso Base, Corso Medio, Corso Avanzato oppure Evento, per esempio una presentazione. Gli eventi hanno etichetta e colore propri, il gruppo Eventi nella pagina pubblica e nel selettore, e nelle loro pagine ed email si parla di evento invece che di corso. I corsi già inseriti non cambiano. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
