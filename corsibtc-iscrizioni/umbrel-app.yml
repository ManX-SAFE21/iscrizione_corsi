releaseNotes: "Lista corsi più compatta: titolo, numero di corsi e scelta del livello stanno tutti nel riquadro colorato in alto, così le schede partono più in alto. Il selettore dei livelli è ora una barra unica. Nelle schede dei corsi con immagine, l'immagine in alto sfuma dolcemente nel testo e l'etichetta del livello sta sopra l'immagine. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
