releaseNotes: "Messaggio dopo l'iscrizione più chiaro: se la data non è ancora fissata dice che scriverete con giorno, orario e luogo al più tardi 7 giorni prima; se è confermata dice la data e invita a guardare i requisiti. Comprende Aggiungi al calendario della 1.12.0. Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
