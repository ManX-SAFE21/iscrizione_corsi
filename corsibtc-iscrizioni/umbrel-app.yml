releaseNotes: "Nuovo nome e nuovo logo: Eventi e Corsi (Bitcoin), con un calendario e la B di Bitcoin. Nel modulo la domanda Quando si fa?: data già decisa (giorno, inizio e fine con i selettori), da scegliere con gli iscritti (fasce orarie) oppure da decidere più avanti. Con la data già decisa la pagina mostra subito la data per esteso e Aggiungi al calendario. Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
