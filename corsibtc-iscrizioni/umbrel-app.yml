releaseNotes: "Pagina di gestione del corso più comoda sul notebook: a destra, sempre visibili mentre scorri, ci sono le voci di gestione, il link con il QR code e la zona pericolosa (elimina corso). La pagina è più larga, così la tabella degli iscritti si legge senza scorrere di lato. Sul telefono le voci tornano sotto il contenuto. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
