releaseNotes: "Pagina del corso migliorata: il pulsante Iscriviti ora è subito in alto, l'immagine sta dentro la testata e si vede intera, il modulo è più corto (campi affiancati) e sul telefono c'è un pulsante Iscriviti fisso in basso. Comprende la 1.17.0 (grafica Bento). Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
