releaseNotes: "Pagina pubblica con le schede sovrapposte in 3D: in ogni gruppo la scheda più recente sta davanti e le altre spuntano dietro verso destra; passandoci sopra una scheda viene davanti. Sul telefono le schede scendono in verticale, la più recente in alto. Gli eventi stanno in cima, prima dei corsi. Comprende gli eventi della 1.8.0 (Nuovo evento, tipo Corso Base, Medio, Avanzato o Evento). La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
