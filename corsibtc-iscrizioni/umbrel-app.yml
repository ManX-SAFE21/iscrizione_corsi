releaseNotes: "Nuova grafica Vetrate: fondo color gemma con luci sfumate, ogni colonna è una vetrata colorata con le schede bianche dentro; pagina del corso e moduli su un foglio chiaro. La gestione ha lo stesso stile con un fondo grigio-viola e un nuovo pulsante Sito pubblico per vedere il sito come i visitatori. Comprende la 1.15.1 (nome Eventi e Corsi su Umbrel). Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
