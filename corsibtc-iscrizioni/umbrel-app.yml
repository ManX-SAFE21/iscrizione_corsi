releaseNotes: "Gli eventi con le iscrizioni chiuse si vedono anche sul sito, con l'etichetta Iscrizioni chiuse: sito e gestione mostrano gli stessi eventi. La gestione si riconosce subito: fascia scura GESTIONE in alto, sfondo grigio-azzurro e titolo della scheda del browser che inizia con Gestione. Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
