releaseNotes: "Nuova impaginazione, più facile da leggere. Lista corsi a schede, con in fondo i corsi già fatti. Pagina del corso con Dove, Quando e Contributo subito sotto il titolo; dettagli, requisiti e programma si aprono con un clic. Modulo d'iscrizione diviso in tappe numerate, con gli stessi campi di prima. Colori più tenui: sfondo carta e verde spento. Nella gestione il pulsante Corso fatto sposta un corso tra i conclusi (resta visibile sul sito, senza modulo); nelle impostazioni si può nascondere l'elenco dei corsi fatti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
