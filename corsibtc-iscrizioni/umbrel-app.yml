releaseNotes: "Pagina del corso più chiara: in alto una riga colorata con tipo e città (per esempio EVENTO · THIENE), poi il titolo da solo e una riga con data e contributo. Date possibili, dettagli, requisiti e programma sono sempre aperti. Il modulo d'iscrizione sta in fondo e il tasto Iscriviti ora porta lì. La colonna a destra è più stretta e lascia più spazio al testo. Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
