releaseNotes: "Aggiungi al calendario: in Conferma corso si possono indicare giorno, ora di inizio e ora di fine. Così nella pagina del corso, dopo l'iscrizione e nell'email di conferma compare Aggiungi al calendario, con file .ics (iPhone, Mac, Outlook), Google Calendar, Outlook.com e Office 365. Comprende anche la 1.11.0 (indice a destra, sottotitolo, dettagli senza spazi vuoti). Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella corsi e iscritti. La pagina pubblica resta raggiungibile solo dal tunnel Cloudflare (servizio http://corsibtc-iscrizioni_web_1:3000)."
